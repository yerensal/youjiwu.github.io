<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>欺歌快跑</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:rgba(0,0,0,0); }
        html,body { height:100%; background:#0a0a1a; color:#fff; overflow:hidden; font-family:'Courier New',monospace; }
        body.desktop { display:flex; justify-content:center; align-items:center; background:radial-gradient(ellipse at center, #1a0a2a 0%, #0a0a1a 100%); }
        #game { border:2px solid rgba(255,215,0,0.2); border-radius:16px; box-shadow:0 0 80px rgba(150,80,255,0.25), inset 0 0 80px rgba(150,80,255,0.05); background:#1a1a2e; image-rendering:pixelated; position:relative; z-index:1; transition:box-shadow 0.4s; }
        #game:hover { box-shadow:0 0 100px rgba(150,80,255,0.35), inset 0 0 80px rgba(150,80,255,0.08); }
        body.desktop #game { width:800px; height:400px; }
        body.mobile #game { max-width:100vw; width:min(800px,100vw); height:auto; display:block; margin:0 auto; border-radius:12px; }

        .control-panel { position:fixed; bottom:20px; left:0; right:0; padding:0 16px; display:flex; justify-content:space-between; align-items:flex-end; z-index:999; pointer-events:none; }
        body.desktop .control-panel { display:none !important; }
        .dpad-group { display:flex; gap:24px; pointer-events:auto; margin-bottom:6px; }
        .dpad-group .btn { width:74px; height:74px; border-radius:50%; font-size:30px; font-weight:bold; background:radial-gradient(circle at 30% 30%, rgba(80,100,200,0.7), rgba(30,40,80,0.9)); backdrop-filter:blur(8px); border:2px solid rgba(255,255,255,0.15); color:#fff; box-shadow:0 8px 0 rgba(10,10,30,0.5), 0 10px 30px rgba(0,0,0,0.6); transition:all 0.08s ease; text-align:center; line-height:74px; padding:0; user-select:none; text-shadow:0 0 10px rgba(255,255,255,0.3); }
        .dpad-group .btn:active { transform:scale(0.88) translateY(4px); background:radial-gradient(circle at 30% 30%, rgba(100,200,255,0.9), rgba(40,80,180,0.9)); box-shadow:0 2px 0 rgba(10,10,30,0.5), 0 0 30px rgba(100,200,255,0.4); }
        .right-actions { display:flex; flex-direction:column; align-items:flex-end; gap:12px; pointer-events:auto; width:auto; }
        .top-func { display:flex; gap:14px; }
        .top-func .btn { width:66px; height:66px; border-radius:50%; font-size:20px; font-weight:bold; background:radial-gradient(circle at 30% 30%, rgba(60,80,180,0.7), rgba(20,30,70,0.9)); backdrop-filter:blur(8px); border:2px solid rgba(255,255,255,0.12); color:#fff; box-shadow:0 6px 0 rgba(10,10,30,0.5), 0 8px 20px rgba(0,0,0,0.5); transition:all 0.08s ease; text-align:center; line-height:66px; padding:0; user-select:none; text-shadow:0 0 8px rgba(255,255,255,0.2); }
        .top-func .btn:active { transform:scale(0.85) translateY(3px); background:radial-gradient(circle at 30% 30%, rgba(255,200,50,0.9), rgba(200,150,30,0.9)); box-shadow:0 2px 0 rgba(10,10,30,0.5), 0 0 30px rgba(255,200,50,0.4); }
        .btn-jump { width:96px; height:96px; border-radius:50%; font-size:26px; font-weight:bold; background:radial-gradient(circle at 30% 30%, rgba(80,220,120,0.9), rgba(30,150,80,0.9)); backdrop-filter:blur(8px); border:3px solid rgba(255,255,255,0.25); color:#fff; box-shadow:0 10px 0 rgba(20,60,30,0.5), 0 12px 30px rgba(0,0,0,0.7); transition:all 0.08s ease; text-align:center; line-height:96px; padding:0; user-select:none; letter-spacing:2px; margin-right:4px; text-shadow:0 0 15px rgba(255,255,255,0.3); }
        .btn-jump:active { transform:scale(0.88) translateY(5px); background:radial-gradient(circle at 30% 30%, rgba(120,255,160,0.9), rgba(40,200,100,0.9)); box-shadow:0 2px 0 rgba(20,60,30,0.5), 0 0 50px rgba(80,255,150,0.5); }
        .btn-pause { position:fixed; top:24px; right:24px; width:50px; height:50px; border-radius:50%; font-size:20px; background:rgba(20,20,40,0.6); backdrop-filter:blur(10px); border:1.5px solid rgba(255,255,255,0.2); color:rgba(255,255,255,0.8); z-index:1000; pointer-events:auto; box-shadow:0 4px 30px rgba(0,0,0,0.5); text-align:center; line-height:50px; padding:0; transition:all 0.25s; }
        .btn-pause:hover { background:rgba(200,50,50,0.8); color:#fff; border-color:rgba(255,100,100,0.5); transform:scale(1.05); box-shadow:0 0 40px rgba(200,50,50,0.3); }
        .btn-pause:active { transform:scale(0.9); background:rgba(200,50,50,0.9); }
    </style>
</head>
<body>
    <canvas id="game" width="800" height="400"></canvas>
    <div class="control-panel">
        <div class="dpad-group">
            <button class="btn" id="btnA">◀</button>
            <button class="btn" id="btnD">▶</button>
        </div>
        <div class="right-actions">
            <div class="top-func">
                <button class="btn" id="btnJ">🔫</button>
                <button class="btn" id="btnK">🔄</button>
            </div>
            <button class="btn-jump" id="btnSpace">跳跃</button>
        </div>
    </div>
    <button class="btn-pause" id="btnP">⏸</button>

    <script>
        // ============================================================
        // 1. 基础设置 & 游戏状态
        // ============================================================
        const canvas = document.getElementById("game");
        const ctx = canvas.getContext("2d");

        function isMobileDevice() { return /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent); }
        if (isMobileDevice()) document.body.classList.add("mobile");
        else document.body.classList.add("desktop");

        const characterList = [
            { name: "欺花", bodyColor: "#ffdddd", eyeColor: "#D80200" },
            { name: "寻歌", bodyColor: "#7088bb", eyeColor: "#ffdd44" }
        ];
        let selectedCharIndex = 0;

        // 生命设定：初始 1 条，上限 3
        const player = {
            x: 120, y: 270, w: 24, h: 24, vx: 0, vy: 0, moveSpeed: 2.2, jumpPower: -10, gravity: 0.45,
            gravityDir: 1, onGround: false, jumpCount: 0, maxJumpCount: 2, shootCooldown: 0, frameCounter: 0,
            lives: 1,
            maxLives: 3,
            invincible: false, invincibleTimer: 0
        };

        const monster = { x: 0, y: 230, w: 72, h: 96, speed: 1.2, gravityDir: 1, vy: 0 };
        let bullets = [], smallMonsters = [], cameraX = 0, distance = 0, coinCount = 0;
        let powerupCount = 0;
        let deathSnapshot = { dist: 0, coins: 0, score: 0, powerups: 0 };
        const groundY = 320, topGroundY = 40;
        let groundPlatform = { x: 0, y: groundY, w: 1000000, h: 80 };
        let topGroundPlatform = { x: 0, y: topGroundY, w: 1000000, h: 60 };
        let obstacles = [], coins = [], gameState = "home", keys = {}, lastGeneratedX = 0, shakeAmount = 0, frameCounter = 0;
        let showModal = false, modalMessage = "";
        let powerups = [], spawnedZones = new Set();

        // 粒子系统
        let heartParticles = [];
        let bubbleTexts = [];
        let particles = [];
        let textParticles = [];

        class Particle {
            constructor(x, y, color, size) {
                this.x = x; this.y = y;
                this.vx = (Math.random() - 0.5) * 2; this.vy = (Math.random() - 0.5) * 2 - 1;
                this.color = color; this.size = size || 2 + Math.random() * 3;
                this.life = 1; this.decay = 0.005 + Math.random() * 0.01;
            }
            update() { this.x += this.vx; this.y += this.vy; this.vy += 0.02; this.life -= this.decay; this.size *= 0.995; }
            draw(ctx) { ctx.globalAlpha = this.life * 0.8; ctx.fillStyle = this.color; ctx.beginPath(); ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2); ctx.fill(); ctx.globalAlpha = 1; }
        }
        function emitParticles(x, y, color, count = 15) { for (let i = 0; i < count; i++) particles.push(new Particle(x, y, color)); }

        function addTextParticle(x, y, text, color = '#ffffff') {
            textParticles.push({
                x: x, y: y, text: text, color: color,
                life: 1, vy: -1.5, decay: 0.015
            });
        }

        // ============================================================
        // 2. 精灵加载
        // ============================================================
        const sprites = {};
        let spritesLoaded = false;
        function loadImage(p) { return new Promise((r, j) => { const img = new Image(); img.onload = () => r(img); img.onerror = () => j(new Error(`Failed: ${p}`)); img.src = p; }); }

        async function loadAllSprites() {
            try {
                sprites.playerSheets = [];
                sprites.playerFrameWidths = [40, 40];
                sprites.playerFrameHeights = [40, 40];
                sprites.playerTotalFrames = 3;
                sprites.playerSheets[0] = await loadImage('images/hua.png');
                sprites.playerSheets[1] = await loadImage('images/ge.png');
                sprites.monsterImg = await loadImage('images/yjw.png');
                try { sprites.smallMonster = await loadImage('images/xyjw.png'); } catch(e) { sprites.smallMonster = null; }
                sprites.smallMonsterVariants = [];
                for (let i = 1; i <= 3; i++) {
                    try {
                        const img = await loadImage(`images/smallMonster${i}.png`);
                        sprites.smallMonsterVariants.push(img);
                        console.log(`✅ 小怪变体 ${i} 加载成功`);
                    } catch(e) { console.warn(`⚠️ 小怪变体 ${i} 未找到，跳过`); }
                }
                sprites.bg = await loadImage('images/bg.png');
                try { sprites.coin = await loadImage('images/coin.png'); } catch(e) { sprites.coin = null; }
                try { sprites.crate = await loadImage('images/crate.png'); } catch(e) { sprites.crate = null; }
                try { sprites.spike = await loadImage('images/spike.png'); } catch(e) { sprites.spike = null; }
                try { sprites.block = await loadImage('images/block.png'); } catch(e) { sprites.block = null; }
                try { sprites.platform = await loadImage('images/platform.png'); } catch(e) { sprites.platform = null; }
                try { sprites.mountain = await loadImage('images/mountain.png'); } catch(e) { sprites.mountain = null; }
                try { sprites.cloud = await loadImage('images/cloud.png'); } catch(e) { sprites.cloud = null; }
                try { sprites.powerup = await loadImage('images/cake.png'); } catch(e) { sprites.powerup = null; }
                try { sprites.powerup2 = await loadImage('images/mianbao.png'); } catch(e) { sprites.powerup2 = null; }
                try { sprites.homeLeft = await loadImage('images/shazige.png'); } catch(e) { sprites.homeLeft = null; }
                try { sprites.homeRight = await loadImage('images/shazihua.png'); } catch(e) { sprites.homeRight = null; }
                try { sprites.bgOverlay = await loadImage('images/huanxiong.png'); } catch(e) { sprites.bgOverlay = null; }

                spritesLoaded = true;
                console.log('✅ 所有贴图加载完成');
            } catch (err) {
                console.error('❌ 贴图加载失败:', err);
                spritesLoaded = false;
            }
        }

        // ---------- 手机按钮绑定 ----------
        {
            const btnA = document.getElementById("btnA"), btnD = document.getElementById("btnD");
            const btnSpace = document.getElementById("btnSpace"), btnK = document.getElementById("btnK");
            const btnJ = document.getElementById("btnJ"), btnP = document.getElementById("btnP");
            const addTouch = (el, keyCode) => { if (!el) return; el.addEventListener("touchstart", e => { e.preventDefault(); keys[keyCode] = true; }, { passive: false }); el.addEventListener("touchend", e => { e.preventDefault(); keys[keyCode] = false; }, { passive: false }); el.addEventListener("touchcancel", e => { e.preventDefault(); keys[keyCode] = false; }, { passive: false }); el.addEventListener("mousedown", e => { e.preventDefault(); keys[keyCode] = true; }); el.addEventListener("mouseup", e => { e.preventDefault(); keys[keyCode] = false; }); el.addEventListener("mouseleave", e => { keys[keyCode] = false; }); };
            addTouch(btnA, "KeyA"); addTouch(btnD, "KeyD");
            if (btnSpace) { btnSpace.addEventListener("touchstart", e => { e.preventDefault(); if (gameState === "playing" && player.jumpCount < player.maxJumpCount) { player.vy = player.jumpPower * player.gravityDir; player.jumpCount += 1; player.onGround = false; } }, { passive: false }); btnSpace.addEventListener("mousedown", e => { if (gameState === "playing" && player.jumpCount < player.maxJumpCount) { player.vy = player.jumpPower * player.gravityDir; player.jumpCount += 1; player.onGround = false; } }); }
            if (btnK) { btnK.addEventListener("touchstart", e => { e.preventDefault(); if (gameState === "playing") { player.gravityDir *= -1; monster.gravityDir = player.gravityDir; player.vy = 0; monster.vy = 0; emitParticles(player.x + 24, player.y + 24, '#44aaff', 30); } }, { passive: false }); btnK.addEventListener("mousedown", e => { if (gameState === "playing") { player.gravityDir *= -1; monster.gravityDir = player.gravityDir; player.vy = 0; monster.vy = 0; emitParticles(player.x + 24, player.y + 24, '#44aaff', 30); } }); }
            if (btnJ) { btnJ.addEventListener("touchstart", e => { e.preventDefault(); if (gameState === "playing" && player.shootCooldown <= 0) { bullets.push({ x: player.x + player.w, y: player.y + player.h / 2 - 5, w: 20, h: 10, speed: 7 }); player.shootCooldown = 12; emitParticles(player.x + player.w, player.y + player.h / 2, '#44ddff', 8); } }, { passive: false }); btnJ.addEventListener("mousedown", e => { if (gameState === "playing" && player.shootCooldown <= 0) { bullets.push({ x: player.x + player.w, y: player.y + player.h / 2 - 5, w: 20, h: 10, speed: 7 }); player.shootCooldown = 12; emitParticles(player.x + player.w, player.y + player.h / 2, '#44ddff', 8); } }); }
            if (btnP) { btnP.addEventListener("touchstart", e => { e.preventDefault(); if (gameState === "playing") gameState = "paused"; else if (gameState === "paused") gameState = "playing"; }, { passive: false }); btnP.addEventListener("mousedown", e => { if (gameState === "playing") gameState = "paused"; else if (gameState === "paused") gameState = "playing"; }); }
        }

        // ---------- 游戏核心逻辑 ----------
        function generateObstacleChunk(startX) {
            const gap = 45 + Math.random() * 40; let posX = startX + gap;
            const patternWeights = [0, 0, 1, 1, 2, 2, 3, 3, 4, 5, 5];
            const pattern = patternWeights[Math.floor(Math.random() * patternWeights.length)];
            const groundTop = groundY, ceilingBottom = topGroundY + topGroundPlatform.h;
            const blockH = 50 + Math.floor(Math.random() * 18), blockW = 32 + Math.floor(Math.random() * 22);
            switch (pattern) {
                case 0: { obstacles.push({ x: posX, y: groundTop - blockH, w: blockW, h: blockH, type: "block" }); if (Math.random() > 0.5) coins.push({ x: posX + blockW / 2, y: groundTop - blockH - 25, r: 10 }); break; }
                case 1: { obstacles.push({ x: posX, y: ceilingBottom, w: blockW, h: blockH, type: "block" }); break; }
                case 2: { obstacles.push({ x: posX, y: groundTop - blockH, w: blockW, h: blockH, type: "block" }); obstacles.push({ x: posX + 40 + Math.random() * 30, y: ceilingBottom, w: blockW, h: blockH, type: "block" }); break; }
                case 3: { const gapBetween = 70 + Math.random() * 30; obstacles.push({ x: posX, y: groundTop - blockH, w: 30, h: blockH, type: "block" }); obstacles.push({ x: posX + gapBetween, y: groundTop - blockH, w: 30, h: blockH, type: "block" }); coins.push({ x: posX + gapBetween / 2, y: groundTop - blockH - 35, r: 10 }); break; }
                case 4: {
                    const count = 1 + Math.floor(Math.random() * 2);
                    for (let i = 0; i < count; i++) {
                        let randomImg = null;
                        if (sprites.smallMonsterVariants && sprites.smallMonsterVariants.length > 0) {
                            randomImg = sprites.smallMonsterVariants[Math.floor(Math.random() * sprites.smallMonsterVariants.length)];
                        }
                        smallMonsters.push({
                            x: posX + i * 35,
                            y: 80 + Math.random() * 200,
                            w: 28, h: 28,
                            speed: -(1.5 + Math.random() * 1.0),
                            img: randomImg
                        });
                    }
                    break;
                }
                case 5: { const count = 4 + Math.floor(Math.random() * 4); for (let i = 0; i < count; i++) coins.push({ x: posX + i * 28, y: 80 + Math.random() * 220, r: 10 }); if (Math.random() > 0.5) obstacles.push({ x: posX + 20, y: 150 + Math.random() * 120, w: 70, h: 14, type: "platform" }); break; }
            }
            if (Math.random() < 0.4) { const extraX = posX + 20 + Math.random() * 60; const typeRand = Math.random(); if (typeRand < 0.45) obstacles.push({ x: extraX, y: 140 + Math.random() * 120, w: 55 + Math.random() * 45, h: 14, type: "platform" }); else if (typeRand < 0.7) obstacles.push({ x: extraX, y: groundTop - 40, w: 25 + Math.random() * 20, h: 40, type: "block" }); else {
                let randomImg = null;
                if (sprites.smallMonsterVariants && sprites.smallMonsterVariants.length > 0) {
                    randomImg = sprites.smallMonsterVariants[Math.floor(Math.random() * sprites.smallMonsterVariants.length)];
                }
                smallMonsters.push({ x: extraX, y: 80 + Math.random() * 200, w: 28, h: 28, speed: -(1.2 + Math.random() * 0.8), img: randomImg });
            } }
            return posX + 110 + Math.random() * 60;
        }

        function initLevel() {
            obstacles = []; coins = []; bullets = []; smallMonsters = []; powerups = []; spawnedZones = new Set();
            heartParticles = []; bubbleTexts = []; textParticles = [];
            coinCount = 0; powerupCount = 0;
            monster.x = player.x - 350; monster.y = groundY - monster.h; monster.gravityDir = 1; monster.vy = 0; monster.speed = 1.2;
            groundPlatform.x = 0; topGroundPlatform.x = 0;
            player.gravityDir = 1; player.vy = 0; player.shootCooldown = 0; player.frameCounter = 0;
            player.x = 120; player.y = 270; player.vx = 0; player.vy = 0; player.jumpCount = 0; player.onGround = false;
            player.lives = 1;
            player.maxLives = 3;
            player.invincible = false; player.invincibleTimer = 0;
            cameraX = 0; distance = 0;
            let lastX = 600; for (let i = 0; i < 35; i++) { lastX = generateObstacleChunk(lastX); } lastGeneratedX = lastX; shakeAmount = 0;
        }

        function rectOverlap(a, b) { return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y; }
        function resolveBoxCollision(p, box) {
            const overlapLeft = (p.x + p.w) - box.x, overlapRight = (box.x + box.w) - p.x;
            const overlapTop = (p.y + p.h) - box.y, overlapBot = (box.y + box.h) - p.y;
            const minOverlapX = Math.min(overlapLeft, overlapRight), minOverlapY = Math.min(overlapTop, overlapBot);
            if (minOverlapX < minOverlapY) { if (overlapLeft < overlapRight) p.x = box.x - p.w; else p.x = box.x + box.w; p.vx = 0; } else {
                if (p.gravityDir === 1) { if (overlapTop < overlapBot) { p.y = box.y - p.h; p.vy = 0; p.onGround = true; p.jumpCount = 0; } else { p.y = box.y + box.h; p.vy = 0; } } else { if (overlapBot < overlapTop) { p.y = box.y + box.h; p.vy = 0; p.onGround = true; p.jumpCount = 0; } else { p.y = box.y - p.h; p.vy = 0; } } }
        }
        function monsterCollision(m, box) {
            const overlapLeft = (m.x + m.w) - box.x, overlapRight = (box.x + box.w) - m.x;
            const overlapTop = (m.y + m.h) - box.y, overlapBot = (box.y + box.h) - m.y;
            const minOverlapX = Math.min(overlapLeft, overlapRight), minOverlapY = Math.min(overlapTop, overlapBot);
            if (minOverlapX < minOverlapY) { if (overlapLeft < overlapRight) m.x = box.x - m.w; else m.x = box.x + box.w; } else {
                if (m.gravityDir === 1) { if (overlapTop < overlapBot) { m.y = box.y - m.h; m.vy = 0; } else { m.y = box.y + box.h; m.vy = 0; } } else { if (overlapBot < overlapTop) { m.y = box.y + box.h; m.vy = 0; } else { m.y = box.y - m.h; m.vy = 0; } } }
        }
        function circleRectOverlap(circle, rect) { let cx = circle.x, cy = circle.y, r = circle.r; let rx = Math.max(rect.x, Math.min(cx, rect.x + rect.w)); let ry = Math.max(rect.y, Math.min(cy, rect.y + rect.h)); let dx = cx - rx, dy = cy - ry; return dx * dx + dy * dy < r * r; }

        // 键盘事件
        window.addEventListener("keydown", e => {
            keys[e.code] = true;
            if (e.code === "KeyR") { if (gameState === "playing" || gameState === "over") resetGame(); }
            if (e.code === "KeyP") { if (gameState === "playing") gameState = "paused"; else if (gameState === "paused") gameState = "playing"; }
            if (e.code === "KeyK" && gameState === "playing") { player.gravityDir *= -1; monster.gravityDir = player.gravityDir; player.vy = 0; monster.vy = 0; emitParticles(player.x + 24, player.y + 24, '#44aaff', 30); }
            if (e.code === "Space" && gameState === "playing") { if (player.jumpCount < player.maxJumpCount) { player.vy = player.jumpPower * player.gravityDir; player.jumpCount += 1; player.onGround = false; } }
            if (e.code === "KeyJ" && gameState === "playing" && player.shootCooldown <= 0) { bullets.push({ x: player.x + player.w, y: player.y + player.h / 2 - 5, w: 20, h: 10, speed: 7 }); player.shootCooldown = 12; emitParticles(player.x + player.w, player.y + player.h / 2, '#44ddff', 8); }
        });
        window.addEventListener("keyup", e => { keys[e.code] = false; });

        // ============================================================
        // Canvas 点击/触摸（全部按钮定位已修正）
        // ============================================================
        canvas.addEventListener("mousedown", (ev) => {
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            const mx = (ev.clientX - rect.left) * scaleX;
            const my = (ev.clientY - rect.top) * scaleY;

            // ---- 弹窗 ----
            if (showModal) {
                if (mx >= 670 && mx <= 730 && my >= 90 && my <= 120) {
                    showModal = false;
                    gameState = "home";
                    return;
                }
                if (mx >= 250 && mx <= 550 && my >= 230 && my <= 280) {
                    player.lives = 3;
                    showModal = false;
                    gameState = "home";
                    alert("🌟 获得睡前童话！");
                    return;
                }
                return;
            }

            // ---- 首页 ----
            if (gameState === "home") {
                if (mx >= 280 && mx <= 520 && my >= 155 && my <= 210) {
                    resetGame();
                    gameState = "playing";
                }
                if (mx >= 280 && mx <= 520 && my >= 225 && my <= 280) {
                    gameState = "charSelect";
                }
                if (mx >= 330 && mx <= 470 && my >= 330 && my <= 366) {
                    showModal = true;
                    modalMessage = "太坏了怎么真想氪";
                }
                return;
            }

            // ---- 角色选择 ----
            if (gameState === "charSelect") {
                if (mx >= 215 && mx <= 275 && my >= 155 && my <= 215) {
                    selectedCharIndex--;

                    ctx.fillStyle = p.type === 'gold' ? '#ffaa00' : '#44aaff';
                    ctx.beginPath(); ctx.arc(px + p.w/2, p.y + p.h/2, p.w/2, 0, Math.PI*2); ctx.fill();

            ctx.fillStyle = "#fff"; ctx.font = "bold 15px monospace"; ctx.textAlign = "left"; ctx.shadowColor = "rgba(0,0,0,0.5)"; ctx.shadowBlur = 8; ctx.fillText("🏃 " + distance + " m", 18, 28); ctx.fillText("🪙 " + coinCount + " 枚", 18, 48); let lifeDisplay = "❤️ " + player.lives + "/" + player.maxLives + " 条命"; if (player.invincible) lifeDisplay += " ✨无敌"; ctx.fillText(lifeDisplay, 18, 68); ctx.shadowBlur = 0;
            ctx.fillStyle = "rgba(0,0,0,0.4)"; ctx.beginPath(); ctx.roundRect(606, 4, 188, 28, 8); ctx.fill(); ctx.fillStyle = "rgba(255,255,255,0.5)"; ctx.font = "12px monospace"; ctx.textAlign = "left"; ctx.fillText("🔫 J 射击 | 🔄 K 反重力", 614, 24);
        }

        // ---------- roundRect polyfill ----------
        if (!CanvasRenderingContext2D.prototype.roundRect) {
            CanvasRenderingContext2D.prototype.roundRect = function(x, y, w, h, r) { if (r > w / 2) r = w / 2; if (r > h / 2) r = h / 2; this.moveTo(x + r, y); this.lineTo(x + w - r, y); this.quadraticCurveTo(x + w, y, x + w, y + r); this.lineTo(x + w, y + h - r); this.quadraticCurveTo(x + w, y + h, x + w - r, y + h); this.lineTo(x + r, y + h); this.quadraticCurveTo(x, y + h, x, y + h - r); this.lineTo(x, y + r); this.quadraticCurveTo(x, y, x + r, y); this.closePath(); return this; };
        }

        async function startGame() { await loadAllSprites(); initLevel(); gameState = "home"; loop(); }
